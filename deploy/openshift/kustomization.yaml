apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aws-dash
resources:
  - ../kubernetes
  - route.yaml
patches:
  - target: {kind: Deployment, name: aws-dash}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_EC2_METADATA_DISABLED
          value: "true"
