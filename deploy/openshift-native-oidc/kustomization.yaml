apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aws-dash
resources:
  - ../kubernetes
  - route.yaml
  - identity-configmap.yaml
patches:
  - target: {kind: ConfigMap, name: aws-dash-config}
    patch: |-
      - op: replace
        path: /data/AUTH_MODE
        value: web-identity
  # Project the service-account token ourselves (audience sts.amazonaws.com), so this works without any webhook.
  - target: {kind: Deployment, name: aws-dash}
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: aws-token
          mountPath: /var/run/secrets/aws
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: aws-dash-identity
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: /var/run/secrets/aws/token
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_EC2_METADATA_DISABLED
          value: "true"
